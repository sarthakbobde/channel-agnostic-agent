services:
  rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: channel-agnostic-agent
    ports:
      # Published on this machine only. Put HTTPS in front before exposing it further.
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
      # The admin page runs on its own port (ADMIN_PORT below), also published on this machine only.
      - "127.0.0.1:${ADMIN_HOST_PORT:-8090}:8090"
    volumes:
      - rag_admin:/app/admin_data
      - rag_chats:/app/chats
      - rag_chroma_db:/app/chroma_db
      - rag_kb_files:/app/data/kb_files
      - rag_models:/app/models
      - ./data/docs:/app/data/docs:ro
      - ./channels.yaml:/app/channels.yaml:ro
    environment:
      # Security: both are required. Generate the key with:  python -m app.secretstore generate
      # BACK UP APP_SECRET_KEY: without it the stored credentials cannot be decrypted.
      - APP_SECRET_KEY=${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
      - CHAT_API_TOKEN=${CHAT_API_TOKEN:?set CHAT_API_TOKEN in .env}
      - ADMIN_DB_PATH=/app/admin_data/admin.db
      # DATABASE_URL=postgresql+psycopg://user:pass@host:5432/db   (optional; replaces the SQLite file)
      - DATABASE_URL=${DATABASE_URL:-}
      - ADMIN_EMAIL_DOMAIN=${ADMIN_EMAIL_DOMAIN:-sysfore.com}
      # The admin page has its own listener, so a tunnel or proxy on the main port never reaches it.
      # Inside Docker it sees the Docker network, not localhost, so remote mode is needed. For use on this
      # machine only (port published on 127.0.0.1 above) HTTPS is waived; to serve it to other people put an
      # HTTPS reverse proxy in front, set ADMIN_REQUIRE_HTTPS=true and publish the port as your proxy needs.
      - ADMIN_PORT=8090
      - ADMIN_HOST=0.0.0.0
      - ADMIN_ALLOW_REMOTE=${ADMIN_ALLOW_REMOTE:-true}
      - ADMIN_REQUIRE_HTTPS=${ADMIN_REQUIRE_HTTPS:-false}
      - WEB_UI_URL=${WEB_UI_URL:-http://localhost:8501}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # LLM (moves into the admin page in the providers phase)
      - NINEROUTER_BASE_URL=${NINEROUTER_BASE_URL:-http://localhost:20128/v1}
      - NINEROUTER_API_KEY=${NINEROUTER_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-testcombo}
      # Channel credentials are first-run seeds only; afterwards they live encrypted in the database.
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
      - TEAMS_APP_ID=${TEAMS_APP_ID:-}
      - TEAMS_APP_PASSWORD=${TEAMS_APP_PASSWORD:-}
      - TEAMS_TENANT_ID=${TEAMS_TENANT_ID:-}
      - GCHAT_AUDIENCE=${GCHAT_AUDIENCE:-}
      - GCHAT_SERVICE_ACCOUNT_EMAIL=${GCHAT_SERVICE_ACCOUNT_EMAIL:-}
      - CHAT_DIR=/app/chats
      - CHROMA_PATH=/app/chroma_db
      - DOCS_DIR=/app/data/kb_files
      - MODELS_DIR=/app/models
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-25}
      - COLLECTION_NAME=${COLLECTION_NAME:-docs}
      # First-run seeds for Global Settings (edit them afterwards on the admin Settings screen)
      - TOP_K=${TOP_K:-5}
      - SCORE_THRESHOLD=${SCORE_THRESHOLD:-0.35}
      - CHUNK_SIZE=${CHUNK_SIZE:-900}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-150}
      - MEMORY_MAX_TURNS=${MEMORY_MAX_TURNS:-6}
    restart: unless-stopped

volumes:
  rag_admin:
    driver: local
  rag_chats:
    driver: local
  rag_chroma_db:
    driver: local
  rag_kb_files:
    driver: local
  rag_models:
    driver: local
